<section class="favoritos">
  <h1>Mis hongos favoritos</h1>

  @for (favorito of favoritosDetalle(); track favorito.taxonId) {
    <article class="tarjeta-favorito">
        <h2>{{ favorito.taxon?.name }}</h2>
        @if (favorito.taxon?.default_photo?.medium_url) {
            <img
                [src]="favorito.taxon?.default_photo?.medium_url"
                [alt]="favorito.taxon?.name"
            >
        }
        <p>Nota: {{ favorito.nota }}</p>
        <button type="button" (click)="editarNota(favorito)">
          Editar nota
        </button>

        <!-- editar nota solo aparece si se clickea editar nota -->
        @if (favoritoEnEdicion() === favorito.taxonId) {
        <input type="text" [value]="notaEditada()" (input)="notaEditada.set($any($event.target).value)"
          placeholder="Escribe tu nota">
          <button type="button" (click)="guardarNota(favorito.taxonId)">
            Guardar Nota
          </button>
        }

        <button type="button" (click)="eliminarFavorito(favorito.taxonId)">
          Eliminar favorito
        </button>
    </article>
  } @empty {
    <p>Todavía no tienes hongos favoritos. </p>
  }
</section>
